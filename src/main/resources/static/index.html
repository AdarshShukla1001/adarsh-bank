<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adarsh Bank | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Adarsh Bank</h1>
            <div>
                <button class="btn" onclick="loadDashboard()">🔄 Refresh Data</button>
            </div>
        </header>

        <div class="grid">
            <!-- Summary Stats -->
            <div class="card">
                <div class="card-title">Total Customers</div>
                <div id="total-customers" class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">Total Accounts</div>
                <div id="total-accounts" class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">Total Liquidity</div>
                <div id="total-liquidity" class="card-value">$0.00</div>
            </div>
        </div>

        <div class="grid" style="margin-top: 3rem;">
            <!-- Create Customer Form -->
            <div class="card">
                <h3>👤 Create Customer</h3>
                <input type="text" id="cust-name" placeholder="Name" class="input">
                <input type="email" id="cust-email" placeholder="Email" class="input">
                <button class="btn" onclick="createCustomer()">Register</button>
            </div>

            <!-- Create Account Form -->
            <div class="card">
                <h3>💳 Open Account</h3>
                <input type="text" id="acc-number" placeholder="Account Number" class="input">
                <select id="acc-cust-id" class="input">
                    <option value="">Select Customer</option>
                </select>
                <input type="number" id="acc-balance" placeholder="Initial Balance" class="input">
                <button class="btn" onclick="openAccount()">Open</button>
            </div>

            <!-- Transfer Money Form -->
            <div class="card">
                <h3>💸 Transfer Money</h3>
                <select id="trans-from" class="input">
                    <option value="">From Account</option>
                </select>
                <select id="trans-to" class="input">
                    <option value="">To Account</option>
                </select>
                <input type="number" id="trans-amount" placeholder="Amount" class="input">
                <button class="btn" onclick="transferMoney()">Send</button>
            </div>
        </div>

        <div style="margin-top: 3rem;">
            <h2>Recent Accounts</h2>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Account Number</th>
                            <th>Customer ID</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-table">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
